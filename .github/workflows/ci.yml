name: CI

# Runs on every PR into main, plus main itself after merge (so a bad merge
# commit doesn't sit undetected). This is the check branch protection on
# `main` should require before allowing a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Build, test, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: the app must actually build. Catches broken imports, bad
      # env-var assumptions, syntax errors, etc.
      - name: Build
        run: npm run build

      # Hard gate: unit, component, routing, i18n-parity and accessibility
      # tests. Two vitest projects — `server` (node) covers the api/ handlers
      # and their helpers; `client` (jsdom) covers React.
      - name: Test
        run: npm test

      # Hard gate: type-checks api/ from its existing JSDoc annotations.
      # No TypeScript is emitted or added to the project.
      - name: Typecheck (api)
        run: npm run typecheck

      # Hard gate: fails if shipped JS/CSS grows past its gzipped budget.
      # Depends on the Build step above having produced dist/.
      - name: Bundle size budget
        run: npm run size

      # Report-only for now: main currently has ~83 pre-existing lint errors
      # (mostly leftover `React` imports from before React 19's JSX
      # transform, plus a few hook-dependency warnings worth a human look).
      # This step surfaces lint results on every PR without blocking merges
      # until that backlog is cleared. Flip `continue-on-error` to false
      # once it's clean.
      - name: Lint (report only, not yet blocking)
        run: npm run lint
        continue-on-error: true

      # Report-only for now: fixing the current high-severity advisories
      # pulls in an unrelated major Vite upgrade (rolldown-based build).
      # That's a real change that deserves its own PR, not something to
      # silently ride in on a CI-setup change. Flip `continue-on-error` to
      # false once resolved.
      - name: Dependency audit (report only, not yet blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Report-only for now: AGENTS.md is what coding agents read before
      # touching this repo, and it documents things that move — dependency
      # versions, env vars, CI gates, the API limits. Nothing about editing
      # package.json reminds you that a version is also written down in a
      # markdown file, so it goes stale silently.
      #
      # This flags a PR that changes a file AGENTS.md describes without
      # touching AGENTS.md. It checks the doc was revisited, not that it is
      # correct — see the header comment in the script. Flip
      # `continue-on-error` to false once its false-positive rate is known.
      #
      # PR-only: there is no base to diff against on a push to main.
      - name: AGENTS.md freshness (report only, not yet blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # Read through the environment, never interpolated into the script
          # below: a PR title is attacker-controlled text.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # actions/checkout leaves a shallow clone of the merge commit, which
          # does not contain the base. Fetching it by sha is enough for a
          # two-dot diff: base..merge-commit is exactly this PR's changes.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | node scripts/check-agents-doc.js
