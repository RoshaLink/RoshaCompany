<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoshaLink — Strategic Design & Tech Agency</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&family=Geist:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CDN with White Smokey & Light Blue theme tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            grotesk: ['Anton', 'sans-serif'],
            condiment: ['Condiment', 'cursive'],
            "headline-xl": ["Montserrat", "sans-serif"],
            "headline-lg": ["Montserrat", "sans-serif"],
            "headline-md": ["Montserrat", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "label-md": ["Geist", "monospace"],
            "label-sm": ["Geist", "monospace"]
          },
          colors: {
            cream: '#EFF4FF',
            neon: '#6FFF00',
            "surface": "#ffffff",
            "surface-dim": "#f1f5f9",
            "surface-bright": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f8fafc",
            "surface-container": "#f1f5f9",
            "surface-container-high": "#e2e8f0",
            "surface-container-highest": "#cbd5e1",
            "on-surface": "#0f172a",
            "on-surface-variant": "#475569",
            "primary": "#0284c7",
            "secondary": "#0284c7",
            "secondary-container": "#38bdf8",
            "on-secondary": "#ffffff",
            "tertiary": "#6366f1",
            "background": "#f8fafc",
            "on-background": "#0f172a",
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-[#f8fafc] text-[#0f172a] font-body-md overflow-x-hidden selection:bg-sky-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
